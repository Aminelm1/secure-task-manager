services:

  postgres:
    image: postgres:16
    container_name: secure-task-postgres
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD:  ${TASK_DB_PASSWORD}
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: secure-task-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - keycloak

  keycloak-db:
    image: postgres:16
    container_name: secure-task-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD:  ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: secure-task-keycloak
    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
      - keycloak-db


volumes:
  postgres_data:
  keycloak_data: