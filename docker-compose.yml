services:
  postgres:
    image: postgres:16
    container_name: secure-task-postgres
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: secure-task-api
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: