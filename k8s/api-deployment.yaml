apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-task-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: secure-task-api

  template:
    metadata:
      labels:
        app: secure-task-api

    spec:
      containers:
        - name: api

          image: ghcr.io/aminelm1/secure-task-api:latest
          imagePullPolicy: Always

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-db-secret
                  key: DATABASE_URL

          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: secure-task-api

spec:
  selector:
    app: secure-task-api

  type: ClusterIP

  ports:
    - port: 8000
      targetPort: 8000